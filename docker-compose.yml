# Local production-like stack: FastAPI + Redis + background worker.
# NOTE: not launched in this environment (no Docker daemon available);
# validated statically only (see README "What didn't work").

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Provider credentials are resolved from the environment (never baked
      # into the image). Prefer a secrets manager in real deployments.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.workers.runner"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    # Multiple replicas are safe: Redis BRPOPLPUSH gives at-most-one delivery,
    # idempotency keys make node side-effects exactly-once.
    deploy:
      replicas: 1

volumes:
  redis-data:
